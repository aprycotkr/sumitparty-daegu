<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A96E;--gold-light:#E8D4A8;--gold-dark:#8A6B3A;
  --bg:#F2F3F5;--surface:#FFFFFF;--surface2:#F2EEE8;--surface3:#E8E2D8;

body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.5rem 3rem;background:rgba(242,243,245,0.96);border-bottom:1px solid rgba(0,0,0,0.07);backdrop-filter:blur(8px)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:500;color:var(--gold);letter-spacing:0.15em;text-decoration:none}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{color:var(--text2);text-decoration:none;font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;transition:color 0.2s;opacity:0.85}
.nav-links a:hover,.nav-links a.active{color:var(--gold);opacity:1}
.nav-menu-btn{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px}
.nav-menu-btn span{display:block;width:24px;height:1px;background:var(--text)}
.mobile-nav{display:none;position:fixed;inset:0;background:var(--surface);z-index:200;flex-direction:column;justify-content:flex-start;padding:5.5rem 2rem 2rem}
.mobile-nav.open{display:flex}
.mobile-nav a{color:var(--text);text-decoration:none;font-size:1.15rem;font-weight:400;letter-spacing:0.08em;padding:1.3rem 0.5rem;border-bottom:1px solid rgba(201,169,110,0.12);transition:color 0.2s}
.mobile-nav a:first-of-type{color:var(--gold)}
.mobile-nav a:hover{color:var(--gold)}
.mobile-nav .mobile-cta{margin-top:2.5rem;background:var(--gold);color:#fff;text-align:center;font-size:0.95rem;font-weight:600;letter-spacing:0.05em;padding:1.2rem;border:none;border-radius:14px;cursor:pointer}
.mobile-nav .mobile-cta:hover{background:var(--gold-dark)}
.mobile-nav-close{position:absolute;top:1.5rem;right:1.8rem;background:none;border:none;color:var(--text);font-size:1.6rem;cursor:pointer;line-height:1}

/* HERO */
.hero{position:relative;height:72vh;min-height:460px;max-height:660px;background:url('대구점.png') center/cover no-repeat;margin-top:68px;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,0.18) 0%,rgba(0,0,0,0.72) 100%)}
.hero-inner{position:absolute;bottom:0;left:0;right:0;padding:0 2rem 2.8rem;max-width:680px;z-index:1}
.hero-label{margin-bottom:1rem}
.hero-label-top{font-size:0.52rem;letter-spacing:0.38em;text-transform:uppercase;color:rgba(255,255,255,0.55);font-weight:500;display:block;margin-bottom:0.25rem}
.hero-label-sub{font-size:0.68rem;color:rgba(255,255,255,0.7);letter-spacing:0.06em;font-weight:300;display:block}
.hero-title{font-family:var(--font-body);font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:800;color:#fff;line-height:1.22;letter-spacing:-0.025em;margin-bottom:1.4rem}
.hero-badges{display:flex;flex-wrap:wrap;gap:0.45rem}

/* SCHEDULE */

/* DATE GRID */
.date-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.date-card{position:relative;background:var(--surface);border:1.5px solid rgba(0,0,0,0.09);border-radius:12px;padding:1.1rem 0.5rem 0.9rem;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;text-align:center;user-select:none}
.date-card:not(.disabled):hover{border-color:rgba(201,169,110,0.5);box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.date-card.selected{background:var(--gold);border-color:var(--gold);box-shadow:0 4px 16px rgba(201,169,110,0.35)}
.date-card.disabled{opacity:0.35;cursor:not-allowed;pointer-events:none}
.date-dot{position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;display:block}
.date-card-dow{font-size:0.58rem;color:var(--text3);letter-spacing:0.06em;margin-bottom:0.3rem;font-weight:500;text-transform:uppercase}
.date-card.selected .date-card-dow{color:rgba(255,255,255,0.72)}

.date-card-status{font-size:0.56rem;font-weight:600;letter-spacing:0.04em}

.date-card-badge-soon{display:inline-flex;align-items:center;gap:3px;background:rgba(185,28,28,0.09);border:1px solid rgba(185,28,28,0.22);color:#B91C1C;font-size:0.52rem;font-weight:700;letter-spacing:0.06em;padding:2px 7px;border-radius:20px}

/* INFO PANEL */
.info-panel{margin-top:0.85rem;background:var(--surface);border-radius:12px;padding:1.3rem 1.4rem 1.4rem;border:1px solid rgba(0,0,0,0.07);animation:fadeIn 0.18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.info-meta{display:flex;align-items:center;gap:0.6rem;font-size:0.73rem;color:var(--text2);margin-bottom:1.1rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid rgba(0,0,0,0.06)}
.info-meta-item{display:flex;align-items:center;gap:0.3rem}
.info-meta-divider{color:rgba(0,0,0,0.15);font-size:0.65rem}
.info-seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.1rem}
.info-seat-card{background:var(--surface2);border:1px solid rgba(0,0,0,0.07);border-radius:10px;padding:0.9rem 1rem;text-align:center}
.info-seat-label{font-size:0.55rem;color:var(--text3);letter-spacing:0.12em;font-weight:600;text-transform:uppercase;margin-bottom:0.4rem}
.info-seat-num{font-size:1.7rem;font-weight:700;color:var(--text);line-height:1;letter-spacing:-0.02em}
.info-seat-num.urgent{color:#9B2C2C}
.cta-btn{width:100%;background:var(--gold);color:#fff;border:none;padding:1rem 1.2rem;border-radius:10px;font-family:var(--font-body);font-size:0.82rem;font-weight:600;letter-spacing:0.04em;cursor:pointer;transition:background 0.2s}
.cta-btn:hover{background:var(--gold-dark)}
.soon-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(185,28,28,0.08);border:1px solid rgba(185,28,28,0.2);color:#B91C1C;font-size:0.65rem;font-weight:700;letter-spacing:0.08em;padding:3px 10px;border-radius:20px}
.soon-badge::before{content:'';width:5px;height:5px;background:#B91C1C;border-radius:50%;animation:soonDot 1.4s ease-in-out infinite}
@keyframes soonDot{0%,100%{opacity:1}50%{opacity:0.25}}

/* 얼리버드 */
.date-card-badge-eb{display:inline-flex;align-items:center;background:rgba(234,88,12,0.09);border:1px solid rgba(234,88,12,0.2);color:#EA580C;font-size:0.52rem;font-weight:700;letter-spacing:0.06em;padding:2px 7px;border-radius:20px}
.date-card.selected .date-card-badge-eb{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4);color:#fff}
.info-price{font-size:0.78rem;color:var(--text2);margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid rgba(0,0,0,0.06)}
.info-price s{color:var(--text3);font-size:0.72rem}
.info-price-eb{display:inline-flex;align-items:center;background:rgba(234,88,12,0.09);border:1px solid rgba(234,88,12,0.2);color:#EA580C;font-size:0.62rem;font-weight:700;letter-spacing:0.06em;padding:2px 8px;border-radius:20px;margin-right:0.4rem}

/* 추석특별 */
.date-card-badge-special{display:inline-flex;align-items:center;background:rgba(201,169,110,0.13);border:1px solid rgba(201,169,110,0.4);color:#8A6B3A;font-size:0.52rem;font-weight:700;letter-spacing:0.06em;padding:2px 7px;border-radius:20px}
.date-card.selected .date-card-badge-special{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4);color:#fff}

/* LOADING */
.loading-msg{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:0.8rem;letter-spacing:0.1em}

@media(max-width:600px){
  nav{padding:1.2rem 1.5rem}
  .nav-links{display:none}
  .nav-menu-btn{display:flex}

  .hero-inner{padding:0 1.2rem 2rem}

  .schedule-wrap{padding:0 1rem 4rem}
  .month-group{padding:1.2rem 1rem}
  .date-grid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
  .date-card{padding:0.85rem 0.4rem 0.75rem}
  .date-card-num{font-size:1.2rem}
}

<script>

  databaseURL: 'https://sumit-admin-default-rtdb.asia-southeast1.firebasedatabase.app',

var CHUSEOK_DATE = '2026-09-24';
var DAY_NAMES = ['일','월','화','수','목','금','토'];
var MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

var selectedDate = null;
var dateStatusMap = {};

function getPartyDates(n) {
  var results = [];
  var now = new Date();
  var explicit = [
    { date: new Date('2026-08-15T00:00:00'), cutoff: new Date('2026-08-15T19:00:00'), dayType: 'sat' },
    { date: new Date('2026-08-21T00:00:00'), cutoff: new Date('2026-08-21T20:00:00'), dayType: 'fri' },
    { date: new Date('2026-08-22T00:00:00'), cutoff: new Date('2026-08-22T19:00:00'), dayType: 'sat' },
    { date: new Date('2026-08-28T00:00:00'), cutoff: new Date('2026-08-28T20:00:00'), dayType: 'fri' },
    { date: new Date('2026-08-29T00:00:00'), cutoff: new Date('2026-08-29T19:00:00'), dayType: 'sat' },
    { date: new Date('2026-09-04T00:00:00'), cutoff: new Date('2026-09-04T20:00:00'), dayType: 'fri' },
    { date: new Date('2026-09-05T00:00:00'), cutoff: new Date('2026-09-05T19:00:00'), dayType: 'sat' },
    { date: new Date('2026-09-11T00:00:00'), cutoff: new Date('2026-09-11T20:00:00'), dayType: 'fri' },
    { date: new Date('2026-09-12T00:00:00'), cutoff: new Date('2026-09-12T19:00:00'), dayType: 'sat' },
    { date: new Date('2026-09-18T00:00:00'), cutoff: new Date('2026-09-18T20:00:00'), dayType: 'fri' },
    { date: new Date('2026-09-19T00:00:00'), cutoff: new Date('2026-09-19T19:00:00'), dayType: 'sat' },
    { date: new Date('2026-09-24T00:00:00'), cutoff: new Date('2026-09-24T20:00:00'), dayType: 'special' },
    { date: new Date('2026-09-25T00:00:00'), cutoff: new Date('2026-09-25T20:00:00'), dayType: 'fri' },
    { date: new Date('2026-09-26T00:00:00'), cutoff: new Date('2026-09-26T19:00:00'), dayType: 'sat' },
  ];
  explicit.forEach(function(e) {
    if (results.length < n && now < e.cutoff) results.push({ date: e.date, dayType: e.dayType });
  });
  var fri = new Date('2026-10-02T00:00:00');
  while (results.length < n) {
    var sat = new Date(fri); sat.setDate(sat.getDate() + 1);
    var friCutoff = new Date(fri); friCutoff.setHours(20,0,0,0);
    var satCutoff = new Date(sat); satCutoff.setHours(19,0,0,0);
    if (now < friCutoff) results.push({ date: new Date(fri), dayType: 'fri' });
    if (results.length < n && now < satCutoff) results.push({ date: new Date(sat), dayType: 'sat' });
    fri.setDate(fri.getDate() + 7);
  }
  return results.slice(0, n);
}

function toKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getMonthLabel(y, mo) {
  var now = new Date();
  var nowY = now.getFullYear(), nowM = now.getMonth();
  if (y === nowY && mo === nowM) return '이번 달 · ' + MONTH_NAMES[mo];
  var nextM = nowM === 11 ? 0 : nowM + 1;
  var nextY = nowM === 11 ? nowY + 1 : nowY;
  if (y === nextY && mo === nextM) return '다음 달 · ' + MONTH_NAMES[mo];
  if (y !== nowY) return y + '년 ' + MONTH_NAMES[mo];
  return MONTH_NAMES[mo];
}

function isEarlyBird(ds) {
  var today = new Date(); today.setHours(0,0,0,0);
  var party = new Date(ds + 'T00:00:00');
  return Math.floor((party - today) / 86400000) > 7;
}

function getStatusInfo(ds) {
  var st = dateStatusMap[ds] || {};
  var male = st.male || '정상';
  var female = st.female || '정상';
  if (male === '마감' && female === '마감') return { label:'마감', dot:'#C4C4C4', textColor:'#9CA3AF', disabled:true };
  if (male === '마감임박' || female === '마감임박') return { label:'마감임박', dot:'#EF4444', textColor:'#DC2626', disabled:false };
  if (male === '마감' && female !== '마감') return { label:'남자마감', dot:'#6366F1', textColor:'#4F46E5', disabled:false };
  if (female === '마감' && male !== '마감') return { label:'여자마감', dot:'#EC4899', textColor:'#DB2777', disabled:false };
  return { label:'예약가능', dot:'#C9A96E', textColor:'#8A6B3A', disabled:false };
}

function getPartyTime(dayType) {
  return dayType === 'sat' ? '19:00~23:30' : '20:00~23:30';
}

function getPriceHtml(ds) {
  var eb = isEarlyBird(ds);
  if (ds === CHUSEOK_DATE) {
    return eb
      ? '<div class="info-price"><span class="info-price-eb">얼리버드</span>남 <s>55,000</s> <strong>50,000원</strong> &nbsp;·&nbsp; 여 <s>40,000</s> <strong>35,000원</strong></div>'
      : '<div class="info-price">남성 55,000원 &nbsp;·&nbsp; 여성 40,000원</div>';
  }
  return eb
    ? '<div class="info-price"><span class="info-price-eb">얼리버드</span>남 <s>61,000</s> <strong>56,000원</strong> &nbsp;·&nbsp; 여 <s>45,000</s> <strong>40,000원</strong></div>'
    : '<div class="info-price">남성 61,000원 &nbsp;·&nbsp; 여성 45,000원</div>';
}

function renderSchedule() {
  var wrap = document.getElementById('scheduleWrap');
  var entries = getPartyDates(30);

  var monthKeys = [];
  var monthMap = {};
  entries.forEach(function(p) {
    var key = p.date.getFullYear() + '-' + p.date.getMonth();
    if (!monthMap[key]) {
      monthMap[key] = { y: p.date.getFullYear(), mo: p.date.getMonth(), entries: [] };
      monthKeys.push(key);
    }
    monthMap[key].entries.push(p);
  });

  wrap.innerHTML = '';

  monthKeys.forEach(function(key) {
    var grp = monthMap[key];
    var y = grp.y, mo = grp.mo;
    var group = document.createElement('div');
    group.className = 'month-group';
    group.id = 'group-' + y + '-' + mo;

    var cards = grp.entries.map(function(p) {
      var d = p.date.getDate();
      var dow = p.date.getDay();
      var ds = toKey(p.date);
      var st = getStatusInfo(ds);
      var isSelected = selectedDate && selectedDate.ds === ds;
      var isSoon = st.label === '마감임박';
      var isChuseok = ds === CHUSEOK_DATE;
      var eb = isEarlyBird(ds);

      var statusEl;
      if (isSelected) {
        statusEl = '<div class="date-card-status" style="color:rgba(255,255,255,0.88)">✓ 선택</div>';
      } else if (isSoon) {
        statusEl = '<div class="date-card-status"><span class="date-card-badge-soon">마감임박</span></div>';
      } else if (isChuseok) {
        statusEl = '<div class="date-card-status"><span class="date-card-badge-special">추석특별</span></div>';
      } else if (eb && st.label === '예약가능') {
        statusEl = '<div class="date-card-status"><span class="date-card-badge-eb">얼리버드</span></div>';
      } else {
        statusEl = '<div class="date-card-status" style="color:' + st.textColor + '">' + st.label + '</div>';
      }

      var onclickVal = st.disabled ? '' : 'selectDateCard(\'' + ds + '\',' + y + ',' + mo + ',' + d + ',' + dow + ',\'' + p.dayType + '\')';
      return '<div class="date-card' + (st.disabled ? ' disabled' : '') + (isSelected ? ' selected' : '') + '"'
        + (onclickVal ? ' onclick="' + onclickVal + '"' : '') + '>'
        + '<span class="date-dot" style="background:' + st.dot + '"></span>'
        + '<div class="date-card-dow">' + DAY_NAMES[dow] + '</div>'
        + '<div class="date-card-num">' + (mo+1) + '/' + d + '</div>'
        + statusEl
        + '</div>';
    }).join('');

    var infoHtml = '';
    if (selectedDate && selectedDate.y === y && selectedDate.mo === mo) {
      var stData = dateStatusMap[selectedDate.ds] || {};
      var mL = stData.maleRemaining !== undefined ? stData.maleRemaining : stData.maleLeft;
      var fL = stData.femaleRemaining !== undefined ? stData.femaleRemaining : stData.femaleLeft;
      var hasMale = mL !== '' && mL !== null && mL !== undefined;
      var hasFemale = fL !== '' && fL !== null && fL !== undefined;
      var isSoonPanel = stData.male === '마감임박' || stData.female === '마감임박';
      var partyTime = getPartyTime(selectedDate.dayType);
      var mUrgent = hasMale && Number(mL) <= 3;
      var fUrgent = hasFemale && Number(fL) <= 3;
      var seatsHtml = (hasMale || hasFemale)
        ? '<div class="info-seats">'
          + (hasMale ? '<div class="info-seat-card"><div class="info-seat-label">남성 잔여</div><div class="info-seat-num' + (mUrgent ? ' urgent' : '') + '">' + mL + '석</div></div>' : '')
          + (hasFemale ? '<div class="info-seat-card"><div class="info-seat-label">여성 잔여</div><div class="info-seat-num' + (fUrgent ? ' urgent' : '') + '">' + fL + '석</div></div>' : '')
          + '</div>'
        : '';
      var btnLabel = (selectedDate.mo+1) + '월 ' + selectedDate.d + '일 신청하기 →';
      infoHtml = '<div class="info-panel">'
        + '<div class="info-meta">'
        + '<span class="info-meta-item">🕐 ' + partyTime + '</span>'
        + '<span class="info-meta-divider">·</span>'
        + '<span class="info-meta-item">📍 대구 중구</span>'
        + (isSoonPanel ? '<span class="info-meta-divider">·</span><span class="soon-badge">마감임박</span>' : '')
        + '</div>'
        + getPriceHtml(selectedDate.ds)
        + seatsHtml
        + '<button class="cta-btn" onclick="goToApply(\'' + selectedDate.ds + '\')">' + btnLabel + '</button>'
        + '</div>';
    }

    group.innerHTML = '<h2 class="month-label">' + getMonthLabel(y, mo) + '</h2>'
      + '<div class="date-grid">' + cards + '</div>'
      + infoHtml;
    wrap.appendChild(group);
  });
}

function selectDateCard(ds, y, mo, d, dow, dayType) {
  selectedDate = { ds: ds, y: y, mo: mo, d: d, dow: dow, dayType: dayType };
  renderSchedule();
  if (typeof fbq !== 'undefined') fbq('track', 'AddToCart', { content_name: '파티 날짜 선택', content_category: '대구', currency: 'KRW', value: 0 });
  setTimeout(function() {
    var panel = document.querySelector('.info-panel');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function goToApply(ds) {
  if (typeof fbq !== 'undefined') fbq('track', 'InitiateCheckout', { content_name: '파티 날짜 선택', content_category: 'daegu' });
  window.location.href = 'daegu-apply.html?date=' + ds;
}

function toggleMenu() { document.getElementById('mobileNav').classList.toggle('open'); }

(function init() {
  var cached = localStorage.getItem('daegu_dateStatus');
  if (cached) { try { dateStatusMap = JSON.parse(cached); } catch(e) {} }
  renderSchedule();

  firebase.database().ref('/daegu/dateStatus').on('value', function(snap) {
    dateStatusMap = snap.val() || {};
    localStorage.setItem('daegu_dateStatus', JSON.stringify(dateStatusMap));
    renderSchedule();
  });
})();
</script>
</body>
</html>
