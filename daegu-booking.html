<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A96E;--gold-light:#E8D4A8;
  --black:#0A0A0A;--dark:#141414;--border:#242424;
  --font-display:'Cormorant Garamond',serif;--font-body:'Montserrat',sans-serif;
}
html{overflow-x:hidden;-webkit-text-size-adjust:none}
body{background:var(--black);color:#fff;font-family:var(--font-body);min-height:100vh;overflow-x:hidden}

/* ── VENUE HEADER ── */
.venue-header{
  position:relative;height:280px;overflow:hidden;
  cursor:pointer;
}
.venue-header img.vh-bg{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(0.42);transition:filter 0.35s;
  display:block;
}
.venue-header:hover img.vh-bg{filter:brightness(0.52);}
.vh-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.68) 100%);
  pointer-events:none;
}
.vh-content{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:20px 22px 26px;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(255,255,255,0.78);font-size:0.83rem;font-weight:500;
  width:fit-content;transition:color 0.2s;text-decoration:none;
}
.back-btn svg{opacity:0.7;}
.venue-header:hover .back-btn{color:#fff;}
.vh-info{margin-top:auto;}
.vh-addr{
  display:flex;align-items:center;gap:5px;
  margin-bottom:9px;
}
.vh-addr span{font-size:0.76rem;color:rgba(255,255,255,0.58);font-weight:400;}
.vh-name{
  font-family:var(--font-display);
  font-size:2.1rem;font-weight:600;color:#fff;
  letter-spacing:0.02em;line-height:1.1;
}
.vh-tag{
  margin-top:7px;font-size:0.7rem;
  color:rgba(255,255,255,0.42);letter-spacing:0.08em;text-transform:uppercase;
}

/* ── CONTENT ── */
.wrap{max-width:520px;margin:0 auto;padding:26px 16px 80px;}
.sec-label{
  font-size:0.68rem;font-weight:700;
  letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px;
}

/* ── PARTY CARDS ── */
.party-list{display:flex;flex-direction:column;gap:10px;}
.party-card{
  background:var(--dark);border:1px solid var(--border);
  border-radius:14px;padding:18px 18px 16px;
  transition:border-color 0.2s,background 0.2s;
}
.party-card:not(.is-closed):hover{border-color:#333;background:#181818;}
.party-card.is-closed{opacity:0.4;pointer-events:none;}

.pc-top{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:10px;
  margin-bottom:13px;
}
.pc-date-col{flex:1;min-width:0;}
.pc-date{font-size:1.02rem;font-weight:600;color:#fff;margin-bottom:3px;white-space:nowrap;}
.pc-time{font-size:0.78rem;color:rgba(255,255,255,0.4);white-space:nowrap;}
.pc-badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.bdg-open{
  background:linear-gradient(135deg,#C9A96E,#a07840);
  color:#000;font-size:0.6rem;font-weight:800;
  padding:3px 9px;border-radius:4px;
  letter-spacing:0.08em;text-transform:uppercase;
}
.bdg-almost{
  background:rgba(255,65,25,0.13);color:#ff6040;
  border:1px solid rgba(255,65,25,0.28);
  font-size:0.6rem;font-weight:700;
  padding:3px 8px;border-radius:4px;
}
.bdg-closed-pill{
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.28);
  font-size:0.6rem;font-weight:600;
  padding:3px 8px;border-radius:4px;
}
.bdg-earlybird{
  background:rgba(201,169,110,0.12);color:var(--gold);
  border:1px solid rgba(201,169,110,0.35);
  font-size:0.6rem;font-weight:700;
  padding:3px 8px;border-radius:4px;
}

.pc-bottom{
  display:flex;align-items:center;
  justify-content:space-between;gap:8px;
}
.pc-seats{font-size:0.78rem;color:rgba(255,255,255,0.38);font-weight:400;}
.btn-apply{

  font-size:0.82rem;font-weight:600;

}
.btn-apply:hover{background:var(--gold);color:#000;}
.btn-closed-label{
  font-size:0.8rem;font-weight:500;
  color:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.1);
  padding:9px 20px;border-radius:9px;
}

.loading-ph{
  text-align:center;padding:44px 0;
  color:rgba(255,255,255,0.28);font-size:0.84rem;
}

@media(max-width:480px){

/* ── TRUST STRIP ── */

.trust-item em{color:rgba(201,169,110,0.85);font-style:normal;font-weight:600}
@media(max-width:480px){.trust-strip{gap:0.7rem 1.2rem;padding:0.65rem 1rem}}

/* ── VIEWER BADGE ── */
.viewer-badge{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 20px;background:#0f0f0f;border-bottom:1px solid rgba(255,255,255,0.08);font-size:0.78rem;color:#fff;font-weight:700;letter-spacing:0.01em}
.viewer-badge .vb-flame{font-size:1rem;line-height:1}
@keyframes vblink{0%,100%{opacity:1}50%{opacity:0.35}}

/* ── DATE GRID ── */
.bk-header{margin-bottom:24px}
.bk-subtitle{font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.bk-title{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:8px;letter-spacing:-0.01em}
.bk-desc{font-size:0.72rem;color:rgba(255,255,255,0.35);line-height:1.6}
.month-card{background:var(--dark);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px}
.month-label{font-size:0.75rem;font-weight:600;color:rgba(255,255,255,0.45);margin-bottom:12px;letter-spacing:0.04em}
.date-grid{display:flex;flex-wrap:wrap;gap:8px}
.date-card{
  width:calc((100% - 16px) / 3);min-width:80px;
  background:var(--dark);border:1px solid var(--border);
  border-radius:12px;padding:14px 8px 10px;cursor:pointer;
  text-align:center;transition:border-color 0.2s,background 0.2s;
  position:relative;-webkit-tap-highlight-color:transparent;
}
.date-card:not(.is-closed):hover{border-color:#333;background:#181818}
.date-card.selected{background:#0d1d36;border-color:#3d72c4;box-shadow:0 0 0 1px rgba(61,114,196,0.25)}
.date-card.is-closed{opacity:0.3;pointer-events:none}
.dc-day{font-size:0.65rem;color:rgba(255,255,255,0.4);margin-bottom:4px;font-weight:500}
.dc-date{font-size:1.05rem;font-weight:700;color:#fff}
.dc-badge{font-size:0.55rem;color:var(--gold);margin-top:5px;min-height:14px;font-weight:600}
.dc-dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.dc-check{position:absolute;top:7px;right:7px;width:16px;height:16px;background:#2d5fa0;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:0.55rem;font-weight:700;color:#fff}
.date-card.selected .dc-check{display:flex}
.date-card.selected .dc-dot{display:none}

/* ── DETAIL PANEL ── */
.detail-panel{display:none;border-top:1px solid rgba(255,255,255,0.07);margin-top:14px;padding-top:14px}
.dp-info-row{display:flex;align-items:center;gap:10px;font-size:0.73rem;color:rgba(255,255,255,0.45);margin-bottom:12px;flex-wrap:wrap}
.dp-almost-badge{background:rgba(255,65,25,0.13);color:#ff6040;border:1px solid rgba(255,65,25,0.28);font-size:0.58rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:auto}
.dp-eb-badge{background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.35);color:var(--gold);font-size:0.58rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:auto}
.dp-seats{display:flex;gap:8px;margin-bottom:10px}
.dp-seat-box{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 8px;text-align:center}
.dp-seat-box.almost{background:rgba(255,80,80,0.1);border-color:rgba(255,80,80,0.2)}
.dp-seat-gender{font-size:0.62rem;color:rgba(255,255,255,0.4);margin-bottom:5px}
.dp-seat-count{font-size:1.5rem;font-weight:700;color:rgba(255,255,255,0.85)}
.dp-seat-box.almost .dp-seat-count{color:#e04444}
.dp-seat-unit{font-size:0.62rem;color:rgba(255,255,255,0.35);font-weight:300;display:inline}
.dp-price{font-size:0.73rem;color:rgba(255,255,255,0.4);margin-bottom:12px}
</style>
</head>

<!-- PARTY LIST -->
<div class="wrap">

    <div class="bk-subtitle">UPCOMING PARTY</div>
    <h2 class="bk-title">파티 일정</h2>
    <p class="bk-desc">원하는 날짜를 선택하면 자리를 바로 확인할 수 있습니다. 자리는 입금 순으로 확정됩니다.</p>

<script>
firebase.initializeApp({
  apiKey: 'AIzaSyBkh-AIqWcLOdUU4uhy9dfbwwPJ_vSgb0',
  authDomain: 'sumit-admin.firebaseapp.com',
  databaseURL: 'https://sumit-admin-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'sumit-admin',
  appId: '1:226522660804:web:53212e3dbf6e88a498ae91'
});
var _fbStatusRef = firebase.database().ref('/daegu/dateStatus');
var OPEN_DATE = '2026-07-11';
var _selectedKey = null;
var _allParties = [];

function getPartyDates(n) {
  var results = [];
  var now = new Date();
  var aug15 = new Date('2026-08-15T00:00:00');
  var aug15Cutoff = new Date('2026-08-15T19:00:00');
  if (now < aug15Cutoff) results.push({ date: aug15, dayType: 'sat' });
  var fri = new Date('2026-08-21T00:00:00');
  while (results.length < n) {
    var sat = new Date(fri); sat.setDate(sat.getDate() + 1);
    var friCutoff = new Date(fri); friCutoff.setHours(20,0,0,0);
    var satCutoff = new Date(sat); satCutoff.setHours(19,0,0,0);
    if (now < friCutoff) results.push({ date: new Date(fri), dayType: 'fri' });
    if (results.length < n && now < satCutoff) results.push({ date: new Date(sat), dayType: 'sat' });
    fri.setDate(fri.getDate() + 7);
  }
  return results.slice(0, n);
}

function toKey(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toLabel(d, dayType) {
  var wd = dayType === 'fri' ? '금' : '토';
  return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wd+')';
}
function toTime(dayType) {
  return dayType === 'fri' ? '20:00–23:30' : '19:00–23:30';
}
function getMonthLabel(d) {
  var now = new Date();
  var dm = d.getMonth()+1, dy = d.getFullYear();
  var nm = now.getMonth()+1, ny = now.getFullYear();
  if (dy === ny && dm === nm) return '이번 달 · ' + dm + '월';
  var nextM = nm === 12 ? 1 : nm+1, nextY = nm === 12 ? ny+1 : ny;
  if (dy === nextY && dm === nextM) return '다음 달 · ' + dm + '월';
  return dm + '월';
}

function renderGroups(status) {
  _allParties = getPartyDates(12);
  var groups = [];
  var groupMap = {};
  _allParties.forEach(function(p) {
    var mk = p.date.getFullYear() + '-' + (p.date.getMonth()+1);
    if (!groupMap[mk]) { groupMap[mk] = []; groups.push({ mk: mk, date: p.date, parties: groupMap[mk] }); }
    groupMap[mk].push(p);
  });

  var container = document.getElementById('monthGroups');
  container.innerHTML = '';

  groups.forEach(function(g) {
    var section = document.createElement('div');
    section.className = 'month-card';

    var ml = document.createElement('div');
    ml.className = 'month-label';
    ml.textContent = getMonthLabel(g.date);
    section.appendChild(ml);

    var grid = document.createElement('div');
    grid.className = 'date-grid';

    g.parties.forEach(function(p) {
      var d = p.date;
      var key = toKey(d);
      var st = status[key] || {};
      var maleSt = st.male || 'open';
      var femaleSt = st.female || 'open';
      var allClosed = maleSt === 'closed' && femaleSt === 'closed';
      var anyAlmost = !allClosed && (maleSt === 'almost' || femaleSt === 'almost');
      var today = new Date(); today.setHours(0,0,0,0);
      var daysUntil = Math.ceil((d - today) / 86400000);
      var isEarlybird = !allClosed && key !== OPEN_DATE && daysUntil > 7;

      var card = document.createElement('div');
      card.className = 'date-card' + (allClosed ? ' is-closed' : '') + (key === _selectedKey ? ' selected' : '');
      card.dataset.key = key;

      var dayShort = p.dayType === 'fri' ? '금' : '토';
      var dateShort = (d.getMonth()+1) + '/' + d.getDate();

      var badgeHtml = '';
      if (allClosed) badgeHtml = '<div class="dc-badge" style="color:rgba(255,255,255,0.25)">마감</div>';
      else if (isEarlybird) badgeHtml = '<div class="dc-badge">얼리버드</div><span class="dc-dot"></span>';
      else if (anyAlmost) badgeHtml = '<div class="dc-badge" style="color:#ff6040">마감임박</div>';
      else badgeHtml = '<div class="dc-badge"></div>';

      card.innerHTML =
        '<div class="dc-day">'+dayShort+'</div>'+
        '<div class="dc-date">'+dateShort+'</div>'+
        badgeHtml+
        '<div class="dc-check">✓</div>';
      var _b = card.querySelector('.dc-badge');
      if (_b) { card.dataset.savedBadgeInner = _b.innerHTML; card.dataset.savedBadgeStyle = _b.getAttribute('style')||''; }

      if (!allClosed) {
        (function(k, party){ card.onclick = function(){ selectDate(k, party, status); }; })(key, p);
      }

      grid.appendChild(card);
    });

    section.appendChild(grid);
    var dp = document.createElement('div');
    dp.className = 'detail-panel';
    section.appendChild(dp);
    container.appendChild(section);
  });

  if (!_selectedKey) {
    var first = _allParties.find(function(p) {
      var k = toKey(p.date);
      var st2 = status[k] || {};
      return !((st2.male||'open')==='closed' && (st2.female||'open')==='closed');
    });
    if (first) selectDate(toKey(first.date), first, status);
  }

  window._venuePartyDate = _selectedKey || '';
}

function selectDate(key, party, status) {
  _selectedKey = key;
  document.querySelectorAll('.date-card').forEach(function(c) {
    var isSel = c.dataset.key === key;
    c.classList.toggle('selected', isSel);
    var badge = c.querySelector('.dc-badge');
    if (badge) {
      if (isSel) {
        badge.innerHTML = '✓ 선택';
        badge.style.cssText = 'color:#7eb5ff;font-weight:700';
      } else {
        badge.innerHTML = c.dataset.savedBadgeInner || '';
        badge.style.cssText = c.dataset.savedBadgeStyle || '';
      }
    }
  });
  window._venuePartyDate = key;

  // hide all panels, show the one inside the same month-card
  document.querySelectorAll('.month-card .detail-panel').forEach(function(p) {
    p.style.display = 'none';
    p.innerHTML = '';
  });
  var selectedCard = document.querySelector('.date-card[data-key="'+key+'"]');
  if (selectedCard) {
    var monthCard = selectedCard.closest('.month-card');
    if (monthCard) showDetail(monthCard.querySelector('.detail-panel'), key, party, status);
  }
}

function showDetail(panel, key, party, status) {
  if (!panel) return;
  var d = party.date;
  var dayType = party.dayType;
  var st = status[key] || {};
  var maleSt = st.male || 'open';
  var femaleSt = st.female || 'open';
  var anyAlmost = maleSt === 'almost' || femaleSt === 'almost';
  var timeStr = toTime(dayType);
  var dayLabel = dayType === 'fri' ? '금요일' : '토요일';

  var today = new Date(); today.setHours(0,0,0,0);
  var daysUntil = Math.ceil((d - today) / 86400000);
  var isEarlybird = key !== OPEN_DATE && daysUntil > 7;
  var origM = 59900, origF = 49900;
  var priceM = isEarlybird ? 54900 : origM;
  var priceF = isEarlybird ? 44900 : origF;

  var mSeat = maleSt === 'closed' ? '마감' : (st.maleRemaining !== undefined ? st.maleRemaining + '<span class="dp-seat-unit">석</span>' : (maleSt === 'almost' ? '마감임박' : ''));
  var fSeat = femaleSt === 'closed' ? '마감' : (st.femaleRemaining !== undefined ? st.femaleRemaining + '<span class="dp-seat-unit">석</span>' : (femaleSt === 'almost' ? '마감임박' : ''));

  var hasManualSeats = st.maleRemaining !== undefined || st.femaleRemaining !== undefined;
  var showBoxes = hasManualSeats || anyAlmost || maleSt === 'closed' || femaleSt === 'closed';
  var seatBoxClass = anyAlmost ? 'dp-seat-box almost' : 'dp-seat-box';
  var seatSection = showBoxes
    ? '<div class="dp-seats"><div class="'+seatBoxClass+'"><div class="dp-seat-gender">남성 잔여</div><div class="dp-seat-count">'+mSeat+'</div></div><div class="'+seatBoxClass+'"><div class="dp-seat-gender">여성 잔여</div><div class="dp-seat-count">'+fSeat+'</div></div></div>'
    : '<div style="font-size:0.72rem;color:rgba(255,255,255,0.4);padding:4px 0 10px">👥 남녀 각 25~35명 정원</div>';

  var rowBadge = anyAlmost
    ? '<span class="dp-almost-badge">마감임박</span>'
    : (isEarlybird ? '<span class="dp-eb-badge">🏷️ 얼리버드</span>' : '');

  var priceLine = isEarlybird
    ? '<span style="opacity:0.4;text-decoration:line-through">남 '+origM.toLocaleString()+' / 여 '+origF.toLocaleString()+'원</span> &nbsp;남 <strong style="color:var(--gold)">'+priceM.toLocaleString()+'</strong> / 여 <strong style="color:var(--gold)">'+priceF.toLocaleString()+'원</strong>'
    : '남 '+origM.toLocaleString()+'원 · 여 '+origF.toLocaleString()+'원';

  panel.innerHTML =
    '<div class="dp-info-row">'+
      '<span>🕒 '+timeStr+'</span>'+
      '<span>📍 대구 중구</span>'+
      rowBadge+
    '</div>'+
    seatSection+
    '<div class="dp-price">'+priceLine+'</div>'+
    '<a class="btn-apply" style="width:100%;justify-content:center;display:flex" '+
      'href="daegu-apply.html?date='+key+'" '+
      'onclick="if(typeof fbq!==\'undefined\')fbq(\'track\',\'InitiateCheckout\',{content_name:\'파티 날짜 선택\',content_category:\'daegu\'})">'+
      dayLabel+' 파티 신청하기'+
    '</a>';

  panel.style.display = 'block';
}

function goToVenue() {
  var date = window._venuePartyDate || '';
  window.location.href = 'daegu-party.html' + (date ? '?date='+date : '');
}

(function init(){
  var cached = localStorage.getItem('daegu_dateStatus');
  try { renderGroups(cached ? JSON.parse(cached) : {}); } catch(e) { renderGroups({}); }

  _fbStatusRef.on('value', function(snap) {
    var newData = snap.val() || {};
    localStorage.setItem('daegu_dateStatus', JSON.stringify(newData));
    renderGroups(newData);
    if (_selectedKey) {
      var sp = _allParties.find(function(x){ return toKey(x.date) === _selectedKey; });
      var sc = document.querySelector('.date-card[data-key="'+_selectedKey+'"]');
      if (sp && sc) {
        var dp = sc.closest('.month-card').querySelector('.detail-panel');
        showDetail(dp, _selectedKey, sp, newData);
      }
    }
  });
})();

(function(){
  var el = document.getElementById('viewerCount');
  if (el) el.textContent = '7';
})();
</script>
</body>
